<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wicaraka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="instansi-info">
                <img src="https://i.ibb.co.com/qY4R6RC9/logo-1.png" alt="Logo Sekolah" class="logo"> 
                <span>SMA NEGERI 1 SULANG</span>
            </div>
            <hr>
            <h1>🗣️ Wicaraka</h1>
            <p>Inovasi Terapi Wicara Digital oleh <strong>[vincitore]</strong></p>
        </header>

        <main class="exercise-section">
            <div class="maskot-talk" style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                <img src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png" style="width: 80px;" alt="Maskot">
                <div style="background: white; padding: 15px; border-radius: 20px; border: 2px solid #eee; position: relative;">
                    <p id="instruction" style="margin: 0; font-weight: bold;">Ayo ikuti suara ini!</p>
                </div>
            </div>

            <div class="level-indicator">
                <label for="level-select" style="display: block; margin-bottom: 8px; font-weight: 800; color: var(--primary-color);">PILIH TANTANGAN:</label>
                <select id="level-select" onchange="changeLevel()" class="custom-select">
                    <option value="1">🎯 Level 1: Isolasi Bunyi</option>
                    <option value="2">🧩 Level 2: Suku Kata</option>
                    <option value="3">🖼️ Level 3: Kata</option>
                    <option value="4">💬 Level 4: Frasa & Kalimat</option>
                    <option value="5">🔄 Level 5: Konversi</option>
                </select>
            </div>

            <div class="practice-card">
                <div class="flashcard-container">
                    <img id="target-img" src="" style="display: none; width: 200px; border-radius: 25px; margin-bottom: 10px;">
                    <h2 id="target-text">A</h2>
                    
                    <button id="play-audio-btn" class="btn-speaker" title="Dengarkan Contoh">
                        🔊 Dengarkan Contoh
                    </button>
                </div>
                
                <button id="start-btn">LANJUTKAN</button> 
                
                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 15px;">
                    <span>Hasil: <span id="user-speech" style="color: var(--warning-color);">-</span></span>
                    <span>Skor: <span id="score" style="color: var(--success-color);">0</span>%</span>
                </div>
            </div>
        </main>

        <section class="progress-section">
            <h3>📈 Laporan Progres</h3>
            <div id="progress-bar-container" style="background: #ddd; border-radius: 10px; height: 10px; width: 100%; margin-bottom: 10px;">
                <div id="progress-bar" style="background: #27ae60; height: 100%; width: 0%; border-radius: 10px; transition: 0.5s;"></div>
            </div>
            <p id="progress-text">Belum ada latihan yang diselesaikan hari ini.</p>
        </section>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item" onclick="openModul('pemanasan')">
            <span class="icon">🧘</span>
            <span class="label">Pemanasan</span>
        </button>
        <button class="nav-item" onclick="openModul('artikulasi')">
            <span class="icon">👅</span>
            <span class="label">Artikulasi</span>
        </button>
        <button class="nav-item" onclick="openModul('kosakata')">
            <span class="icon">🍎</span>
            <span class="label">Kosakata</span>
        </button>
    </nav>

    <footer>
        <div class="dev-info">
            <p>© 2026 - Dikembangkan untuk Lomba Krenova</p>
            <small>Bidang Inovasi: Pendidikan & Kesehatan</small>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
